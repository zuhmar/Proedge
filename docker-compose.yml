services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proedge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proedge}
      POSTGRES_DB: ${POSTGRES_DB:-proedge}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-proedge}:${POSTGRES_PASSWORD:-proedge}@db:5432/${POSTGRES_DB:-proedge}
      DEMO_MODE: ${DEMO_MODE:-true}
      SMTP_HOST: mail
      SMTP_PORT: 1025
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
